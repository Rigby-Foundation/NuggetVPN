version: '3'

vars:
  APP_NAME: "NuggetVPN"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  # Matches the strictPort setting in frontend/vite.config.ts.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 1420}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

  # sing-box gates features behind build tags, and a missing one fails *silently
  # at runtime*: no Reality (with_utls), no Hysteria2/TUIC (with_quic), no TUN
  # (with_gvisor). buildtags.go turns that into a compile error, and the default
  # below means a plain `wails3 build` still picks them up.
  SING_BOX_TAGS: "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_dhcp,with_acme"
  EXTRA_TAGS: '{{.EXTRA_TAGS | default "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_dhcp,with_acme"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs the Go test suite with the production build tags
    cmds:
      - go test -tags "{{.SING_BOX_TAGS}}" -count=1 ./...

  vet:
    summary: Static analysis with the production build tags
    cmds:
      - go vet -tags "{{.SING_BOX_TAGS}}" ./...

  tags:
    summary: Prints the sing-box build tags
    silent: true
    cmds:
      - echo "{{.SING_BOX_TAGS}}"
