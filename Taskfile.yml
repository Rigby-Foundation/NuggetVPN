version: '3'

vars:
  APP_NAME: "Kage"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  # Matches the strictPort setting in frontend/vite.config.ts.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 1420}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

  # Optional extra Go build tags; native Xray needs no feature tags.
  EXTRA_TAGS: '{{.EXTRA_TAGS | default ""}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  android: ./build/android/Taskfile.yml
  ios: ./build/ios/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs the Go test suite
    deps:
      - task: ensure:frontend:dist
    cmds:
      - go test -count=1 ./...

  vet:
    summary: Static analysis
    deps:
      - task: ensure:frontend:dist
    cmds:
      - go vet ./...

  ensure:frontend:dist:
    # main.go embeds frontend/dist, which is a build artifact and therefore not
    # in git. Any Go tooling — vet, test, a bare `go build` — fails on a fresh
    # clone without it. The tests never read the embedded assets, so a
    # placeholder is enough; real builds overwrite it via `bun run build`.
    internal: true
    status:
      - test -d frontend/dist
    cmds:
      - mkdir -p frontend/dist
      - echo '<!doctype html><title>Kage</title>' > frontend/dist/index.html

  tags:
    summary: Prints optional extra Go build tags
    silent: true
    cmds:
      - echo "{{.EXTRA_TAGS}}"
