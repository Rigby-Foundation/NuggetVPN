[package]
name = "nuggetvpn"
version = "1.0.0-beta.2"
description = "Modern, lightweight VPN client built with Tauri v2 and React"
authors = ["Rigby Foundation"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nuggetvpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1.18.1", features = ["v4"] }
reqwest = { version = "0.11", features = ["json", "blocking", "socks"] }
base64 = "0.21"
url = "2.5"
urlencoding = "2.1.3"
tempfile = "3.10"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2.4.4"
tokio = { version = "1", features = ["full"] }
clash-lib = { git = "https://github.com/Rigby-Foundation/clash-rs.git", package = "clash-lib", rev = "b8064b0380b898d66107977ae5ddfdc1f3ae48fb", features = ["tun", "shadowsocks", "tuic", "ssh", "wireguard"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user"] }
