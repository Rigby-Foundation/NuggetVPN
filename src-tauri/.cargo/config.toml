[build]
target-cpu = "native"

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-s",           # Strip symbols at link time
    "-C", "embed-bitcode=no",      # Don't embed bitcode (smaller)
]

[target.x86_64-apple-darwin]  
rustflags = [
    "-C", "link-arg=-s",           # Strip symbols at link time
    "-C", "embed-bitcode=no",      # Don't embed bitcode (smaller)
]