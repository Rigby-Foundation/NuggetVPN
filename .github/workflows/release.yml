name: Release
on:
  push:
    tags:
      - "v*"

env:
  WAILS_VERSION: v3.0.0-beta.28

# Runners are GitHub-hosted.
jobs:
  macos:
    name: macOS (universal .dmg)
    # Apple Silicon; the universal build compiles arm64 and amd64 then lipos
    # them together.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Put Go tool binaries on PATH
        # setup-go does not add GOPATH/bin, which is where `go install` puts
        # the wails3 CLI.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build universal .dmg
        run: wails3 task darwin:package:universal:dmg DMG_NAME="NuggetVPN-${{ github.ref_name }}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: bin/*.dmg
          if-no-files-found: error

  ios:
    name: iOS (unsigned .ipa)
    # Unsigned: Nugget has no App Store or TestFlight distribution, so the
    # .ipa is for people who sign apps with their own certificate. Their
    # certificate must allow Network Extensions (packet tunnel) for the
    # tunnel to start; a free Apple ID's does not.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Put Go tool binaries on PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Point the Go build at the iOS entry point
        # What `wails3 ios overlay:gen` writes, written by hand: running it
        # would also regenerate build/ios/xcode/gen/main_ios.gen.go and drop
        # the packet tunnel's exported functions.
        shell: bash
        run: |
          printf '{"Replace":{"%s/main_ios.gen.go":"%s/build/ios/xcode/gen/main_ios.gen.go"}}' "$PWD" "$PWD" > build/ios/xcode/overlay.json

      - name: Build .ipa
        shell: bash
        run: |
          wails3 task ios:ipa
          mv bin/NuggetVPN.ipa "bin/NuggetVPN-${{ github.ref_name }}-ios-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: bin/*.ipa
          if-no-files-found: error

  linux:
    name: Linux (.deb / .rpm / .AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libfuse2 is what the produced AppImage needs at runtime.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libfuse2

      - name: Put Go tool binaries on PATH
        # setup-go does not add GOPATH/bin, which is where `go install` puts
        # the wails3 CLI.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Package
        run: wails3 task linux:package

      - name: Rename artifacts
        run: |
          cd bin
          for file in *.deb *.rpm *.AppImage; do
            [ -e "$file" ] || continue
            extension="${file##*.}"
            mv "$file" "NuggetVPN-${{ github.ref_name }}-linux-amd64.${extension}"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Put Go tool binaries on PATH
        # setup-go does not add GOPATH/bin, which is where `go install` puts
        # the wails3 CLI.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        # The installer is built with makensis, which the windows-2025 image
        # does not ship (GitHub's older Windows images did). Chocolatey when
        # the image has it, otherwise the official zip.
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis already installed"
            exit 0
          }
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install nsis -y --no-progress
          } else {
            $version = "3.11"
            $zip = Join-Path $env:RUNNER_TEMP "nsis.zip"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip" -OutFile $zip -UserAgent "curl/8" -MaximumRedirection 10
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            $nsisDir = Join-Path $env:RUNNER_TEMP "nsis-$version"
          }
          if (-not (Test-Path (Join-Path $nsisDir "makensis.exe"))) {
            throw "makensis.exe not found in $nsisDir after installing NSIS"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Package
        # Produces bin/NuggetVPN.exe plus bin/NuggetVPN-amd64-installer.exe.
        run: wails3 task windows:package

      - name: Package the silent installer
        # bin/NuggetVPN-amd64-silent-installer.exe: no pages, starts the app.
        run: wails3 task windows:create:nsis:silent

      - name: Archive
        shell: bash
        run: |
          cd bin
          7z a "NuggetVPN-${{ github.ref_name }}-windows-amd64.zip" NuggetVPN.exe
          for installer in *-installer.exe; do
            [ -e "$installer" ] || continue
            # The silent one keeps "silent" in its name: both match the glob.
            case "$installer" in
              *-silent-installer.exe) mv "$installer" "NuggetVPN-${{ github.ref_name }}-windows-amd64-silent-installer.exe" ;;
              *) mv "$installer" "NuggetVPN-${{ github.ref_name }}-windows-amd64-installer.exe" ;;
            esac
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            bin/*.zip
            bin/*-installer.exe
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The shared build steps compile for the host too, which needs GTK.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # The runner image has the Android SDK; only the NDK and the platform
      # the app compiles against are added. (android-actions/setup-android
      # asks for the long-gone "tools" package and fails.)
      - name: Install the Android NDK and platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Put Go tool binaries on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # A release has to be signed with the same key every time, or phones
      # refuse the update. Set the ANDROID_KEYSTORE_BASE64 (the keystore,
      # base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
      # ANDROID_KEY_PASSWORD secrets; without them the APK is signed with a
      # throwaway debug key and a warning is printed.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key, and will not update an earlier install."
          fi

      - name: Package
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          wails3 task android:package
          mv bin/NuggetVPN.apk "bin/NuggetVPN-${{ github.ref_name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: bin/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, ios, linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "NuggetVPN ${{ github.ref_name }}"
          body: "See the assets to download this version and install."
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.zip
            artifacts/**/*-installer.exe
            artifacts/**/*.apk
            artifacts/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
