name: Release
on:
  push:
    tags:
      - "v*"

env:
  WAILS_VERSION: v3.0.0-alpha2.117

# Runners are Blacksmith. The cache actions below are the upstream ones on
# purpose: Blacksmith intercepts them and serves from a colocated cache, and its
# own useblacksmith/* forks are archived.
jobs:
  macos:
    name: macOS (universal .dmg)
    # Apple Silicon; the universal build compiles arm64 and amd64 then lipos
    # them together, so the extra cores pay for themselves here.
    runs-on: blacksmith-12vcpu-macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Put Go tool binaries on PATH
        # setup-go does not add GOPATH/bin, which is where `go install` puts
        # the wails3 CLI.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build universal .dmg
        run: wails3 task darwin:package:universal:dmg DMG_NAME="NuggetVPN-${{ github.ref_name }}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: bin/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (.deb / .rpm / .AppImage)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libfuse2 is what the produced AppImage needs at runtime.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libfuse2

      - name: Put Go tool binaries on PATH
        # setup-go does not add GOPATH/bin, which is where `go install` puts
        # the wails3 CLI.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Package
        run: wails3 task linux:package

      - name: Rename artifacts
        run: |
          cd bin
          for file in *.deb *.rpm *.AppImage; do
            [ -e "$file" ] || continue
            extension="${file##*.}"
            mv "$file" "NuggetVPN-${{ github.ref_name }}-linux-amd64.${extension}"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installer)
    # Blacksmith's Windows runners are in public beta; swap back to
    # `windows-latest` if this job turns flaky.
    runs-on: blacksmith-8vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Put Go tool binaries on PATH
        # setup-go does not add GOPATH/bin, which is where `go install` puts
        # the wails3 CLI.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        # The installer is built with makensis, which the Blacksmith Windows
        # image does not ship (GitHub's older Windows images did). Chocolatey
        # when the image has it, otherwise the official zip.
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis already installed"
            exit 0
          }
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install nsis -y --no-progress
          } else {
            $version = "3.11"
            $zip = Join-Path $env:RUNNER_TEMP "nsis.zip"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip" -OutFile $zip -UserAgent "curl/8" -MaximumRedirection 10
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            $nsisDir = Join-Path $env:RUNNER_TEMP "nsis-$version"
          }
          if (-not (Test-Path (Join-Path $nsisDir "makensis.exe"))) {
            throw "makensis.exe not found in $nsisDir after installing NSIS"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Package
        # Produces bin/NuggetVPN.exe plus bin/NuggetVPN-amd64-installer.exe.
        run: wails3 task windows:package

      - name: Archive
        shell: bash
        run: |
          cd bin
          7z a "NuggetVPN-${{ github.ref_name }}-windows-amd64.zip" NuggetVPN.exe
          for installer in *-installer.exe; do
            [ -e "$installer" ] || continue
            mv "$installer" "NuggetVPN-${{ github.ref_name }}-windows-amd64-installer.exe"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            bin/*.zip
            bin/*-installer.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, linux, windows]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "NuggetVPN ${{ github.ref_name }}"
          body: "See the assets to download this version and install."
          draft: true
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.zip
            artifacts/**/*-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
