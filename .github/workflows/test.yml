name: Test Build
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

# Superseded runs are pointless here: a CGO build of sing-box plus Wails is the
# expensive part, so cancel the previous one on a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build tags live in Taskfile.yml and are applied automatically by
# `wails3 task build`; buildtags.go fails the build if any are missing.
env:
  SING_BOX_TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_dhcp,with_acme
  WAILS_VERSION: v3.0.0-alpha2.117

# Runners are Blacksmith. Note the cache actions below are the upstream ones on
# purpose: Blacksmith intercepts them and serves from a colocated cache, and its
# own useblacksmith/* forks are archived.
jobs:
  test:
    name: Go tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos
            runner: blacksmith-6vcpu-macos-15
          - name: windows
            runner: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Create placeholder frontend assets
        # main.go embeds frontend/dist, a build artifact that is not in git, so
        # Go tooling cannot even load the package without it. The tests never
        # read the embedded assets; the build job compiles the real frontend.
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>NuggetVPN</title>' > frontend/dist/index.html

      - name: Vet
        run: go vet -tags "$SING_BOX_TAGS" ./...
        shell: bash

      - name: Test
        run: go test -tags "$SING_BOX_TAGS" -count=1 ./...
        shell: bash

  android:
    name: Build (android)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # The runner image has the Android SDK; only the NDK and the platform
      # the app compiles against are added. (android-actions/setup-android
      # asks for the long-gone "tools" package and fails.)
      - name: Install the Android NDK and platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Put Go tool binaries on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build a debug APK
        run: |
          set -o pipefail
          wails3 task android:apk 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      # The end of a failed build, as an annotation on the run, which can be
      # read without opening the full log.
      - name: Report a failed build
        if: failure()
        run: |
          grep -nE "error:|FAILED|What went wrong|Exception|cannot find symbol|e: " "$RUNNER_TEMP/android-build.log" | head -40 > "$RUNNER_TEMP/errors.txt" || true
          tail -60 "$RUNNER_TEMP/android-build.log" >> "$RUNNER_TEMP/errors.txt"
          echo "::error title=Android build::$(sed -e 's/%/%25/g' -e 's/\r//g' "$RUNNER_TEMP/errors.txt" | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuggetVPN-android-debug
          path: bin/NuggetVPN.apk
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    # Deliberately not gated on `test`: both compile the same dependency tree,
    # so running them in parallel roughly halves wall-clock time, and a genuine
    # compile error fails the build job on its own anyway.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: blacksmith-12vcpu-macos-15
          - name: linux-amd64
            runner: blacksmith-8vcpu-ubuntu-2404
          - name: windows-amd64
            runner: blacksmith-8vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Put Go tool binaries on PATH
        # setup-go does not add GOPATH/bin, which is where `go install` puts
        # the wails3 CLI.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build
        if: runner.os != 'macOS'
        run: wails3 task build

      # A bare Mach-O is not something anyone can run: macOS needs the bundle
      # for its Info.plist, its icon and its signature. `package` depends on
      # `build`, so this still fails on a compile error.
      - name: Package .app
        if: runner.os == 'macOS'
        run: wails3 task package

      # upload-artifact zips without preserving the executable bit, and that
      # also breaks the ad-hoc signature `package` applies — leaving a bundle
      # macOS refuses to launch. ditto is the one that keeps a bundle intact.
      - name: Archive .app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent bin/NuggetVPN.app bin/NuggetVPN-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuggetvpn-${{ matrix.name }}
          # The zip carries the bundle; uploading the directory as well would
          # ship the broken copy next to the good one.
          path: |
            bin/*
            !bin/NuggetVPN.app
          if-no-files-found: error
