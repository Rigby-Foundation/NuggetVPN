name: Test Build
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15-intel' # Intel
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            singbox_arch: 'amd64'
            singbox_os: 'darwin'
            ext: 'tar.gz'

          - platform: 'macos-15' # Apple Silicon
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            singbox_arch: 'arm64'
            singbox_os: 'darwin'
            ext: 'tar.gz'

          - platform: 'ubuntu-22.04' # Linux (Debian-style)
            args: '--bundles deb,appimage'
            target: 'x86_64-unknown-linux-gnu'
            singbox_arch: 'amd64'
            singbox_os: 'linux'
            ext: 'tar.gz'
            linux_distro: 'ubuntu'

          - platform: 'ubuntu-22.04' # Linux (Fedora container -> rpm)
            args: '--bundles rpm'          # <-- убрал appimage
            target: 'x86_64-unknown-linux-gnu'
            singbox_arch: 'amd64'
            singbox_os: 'linux'
            ext: 'tar.gz'
            linux_distro: 'fedora'
            container_image: 'fedora:latest'

          - platform: 'windows-latest' # Windows
            args: ''
            target: 'x86_64-pc-windows-msvc'
            singbox_arch: 'amd64'
            singbox_os: 'windows'
            ext: 'zip'

    runs-on: ${{ matrix.platform }}

    # Fedora job runs inside a Fedora container (no native runner exists)
    container: ${{ matrix.container_image }}

    steps:
      - uses: actions/checkout@v4

      # Packages/tools needed only for Fedora container because it starts empty-ish
      - name: Install base tools (Fedora container)
        if: matrix.linux_distro == 'fedora'
        run: |
          dnf -y update
          dnf -y install git curl wget file unzip tar xz findutils which

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Linux dependencies (Ubuntu)
        if: matrix.linux_distro == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install Linux dependencies (Fedora)
        if: matrix.linux_distro == 'fedora'
        run: |
          dnf -y install \
            nodejs npm \
            gcc gcc-c++ make \
            openssl-devel \
            gtk3-devel \
            webkit2gtk4.1-devel \
            libayatana-appindicator3-devel \
            librsvg2-devel \
            libsoup3-devel \
            xdg-utils

      - name: Install frontend dependencies
        run: bun install

      - name: Setup sing-box sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          VERSION="1.12.12"
          OS="${{ matrix.singbox_os }}"
          ARCH="${{ matrix.singbox_arch }}"
          TARGET="${{ matrix.target }}"
          EXT="${{ matrix.ext }}"

          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-${OS}-${ARCH}.${EXT}"

          echo "Downloading sing-box from $URL"
          curl -L -o "sing-box.${EXT}" "$URL"

          if [ "$EXT" = "zip" ]; then
            unzip "sing-box.${EXT}"
          else
            tar -xzf "sing-box.${EXT}"
          fi

          DIR_NAME="sing-box-${VERSION}-${OS}-${ARCH}"

          if [ "$OS" = "windows" ]; then
            mv "$DIR_NAME/sing-box.exe" "src-tauri/bin/sing-box-${TARGET}.exe"
          else
            mv "$DIR_NAME/sing-box" "src-tauri/bin/sing-box-${TARGET}"
            chmod +x "src-tauri/bin/sing-box-${TARGET}"
          fi

          echo "Sidecar binary prepared:"
          ls -l src-tauri/bin/

      - name: Build (Test)
        run: bun tauri build ${{ matrix.args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuggetvpn-${{ matrix.platform }}${{ matrix.linux_distro && format('-{0}', matrix.linux_distro) || '' }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
