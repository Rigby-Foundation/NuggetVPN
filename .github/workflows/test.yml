name: Test Build
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

# The build tags live in Taskfile.yml and are applied automatically by
# `wails3 task build`; buildtags.go fails the build if any are missing.
env:
  SING_BOX_TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_dhcp,with_acme
  WAILS_VERSION: v3.0.0-alpha2.117

jobs:
  test:
    name: Go tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Vet
        run: go vet -tags "$SING_BOX_TAGS" ./...
        shell: bash

      - name: Test
        run: go test -tags "$SING_BOX_TAGS" -count=1 ./...
        shell: bash

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
          - name: linux-amd64
            platform: ubuntu-24.04
          - name: windows-amd64
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails3 task build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuggetvpn-${{ matrix.name }}
          path: bin/*
          if-no-files-found: error
