version: '3'

vars:
  SIM_ID: '{{.SIM_ID | default "FA0D23C3-B010-4DC7-898F-74EFB10175B2"}}'
  XCODE_PROJ: "build/ios/xcode/main.xcodeproj"
  SCHEME: "NuggetVPN"
  APP_OUTPUT: "/Users/turborigby/Library/Developer/Xcode/DerivedData/main-hkjfsjagolbwlbdcgmmzbxkzlnws/Build/Products/Debug-iphonesimulator/NuggetVPN.app"

tasks:
  gen:
    summary: Generates the iOS Xcode project and overlay
    cmds:
      - wails3 ios overlay:gen -out build/ios/xcode/overlay.json -config build/config.yml
      - wails3 ios xcode:gen -out build/ios/xcode -config build/config.yml

  archive:
    summary: Compiles the Go c-archive for iOS Simulator
    cmds:
      - npm --prefix frontend run build
      - |
        SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
        GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
        CGO_CFLAGS="-isysroot ${SDK_PATH} -target arm64-apple-ios15.0-simulator -mios-simulator-version-min=15.0 -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-isysroot ${SDK_PATH} -target arm64-apple-ios15.0-simulator" \
        go build -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_dhcp,with_acme" -buildmode=c-archive -overlay build/ios/xcode/overlay.json -o bin/NuggetVPN.a .

  build:
    summary: Builds NuggetVPN for the iOS Simulator using xcodebuild
    deps:
      - archive
    cmds:
      - xcodebuild -project {{.XCODE_PROJ}} -scheme {{.SCHEME}} -destination 'generic/platform=iOS Simulator' -configuration Debug build

  install:
    summary: Installs the built NuggetVPN app into the iOS simulator
    cmds:
      - xcrun simctl install {{.SIM_ID}} {{.APP_OUTPUT}}

  open:
    summary: Opens the generated Xcode project in Xcode
    cmds:
      - open {{.XCODE_PROJ}}

  ipa:
    summary: Builds and packages NuggetVPN.ipa for physical iOS devices
    cmds:
      - npm --prefix frontend run build
      - |
        rm -f bin/NuggetVPN.a
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
        CGO_CFLAGS="-isysroot ${SDK_PATH} -target arm64-apple-ios15.0 -miphoneos-version-min=15.0 -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-isysroot ${SDK_PATH} -target arm64-apple-ios15.0" \
        go build -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_dhcp,with_acme" -buildmode=c-archive -overlay build/ios/xcode/overlay.json -o bin/NuggetVPN.a .
      - |
        xcodebuild -project {{.XCODE_PROJ}} -scheme {{.SCHEME}} -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - |
        IPA_DIR="build/ios/ipa"
        rm -rf "${IPA_DIR}"
        mkdir -p "${IPA_DIR}/Payload"
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NuggetVPN.app" -path "*/Release-iphoneos/*" -type d | head -n 1)
        cp -R "${APP_PATH}" "${IPA_DIR}/Payload/"
        rm -f bin/NuggetVPN.ipa
        cd "${IPA_DIR}" && zip -qr "../../../bin/NuggetVPN.ipa" Payload
        echo "Created bin/NuggetVPN.ipa successfully"

  package:
    summary: Packages a production IPA
    deps:
      - ipa
